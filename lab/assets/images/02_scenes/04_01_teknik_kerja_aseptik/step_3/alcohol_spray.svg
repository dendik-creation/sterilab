    <path d="M56 26 h26 v10 h-26 z" fill="#5E93D6"/>
    <!-- neck -->
    <rect x="52" y="64" width="32" height="16" rx="4" fill="#2C5FA8"/>
    <!-- body -->
    <rect x="30" y="78" width="76" height="104" rx="16" fill="url(#bod)" stroke="#3471C7" stroke-width="4"/>
    <rect x="38" y="120" width="60" height="56" rx="10" fill="url(#liq)" opacity="0.85"/>
    <!-- label -->
    <rect x="31" y="104" width="74" height="44" rx="7" fill="#FFFFFF" stroke="#04488B" stroke-width="3"/>
    <text x="68" y="122" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="13" font-weight="800" letter-spacing="-0.3" fill="#04488B" text-anchor="middle">ALKOHOL</text>
    <text x="68" y="140" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#04488B" text-anchor="middle">70%</text>
    <!-- highlight -->
