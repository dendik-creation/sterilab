<svg xmlns="http://www.w3.org/2000/svg" width="148" height="206" viewBox="0 0 148 206">
  <defs>
    <linearGradient id="bod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.42" stop-color="#EAF4FD"/><stop offset="1" stop-color="#C7DEF3"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CD8F5"/><stop offset="1" stop-color="#63B8E8"/>
    </linearGradient>
  </defs>
  <!-- 8px transparent padding on every side, like the step_2 exports -->
  <g transform="translate(8 8)">
