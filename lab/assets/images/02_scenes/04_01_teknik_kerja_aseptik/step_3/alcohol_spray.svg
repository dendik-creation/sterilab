    <path d="M64 6 h30 a10 10 0 0 1 10 10 v10 h16 a8 8 0 0 1 0 16 h-16 v6 a12 12 0 0 1 -12 12 h-28 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12 z" fill="#3471C7"/>
